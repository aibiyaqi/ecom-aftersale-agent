name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要部署的镜像 tag（例如 v2.0.0）"
        required: true
        type: string
      confirm:
        description: '输入 deploy 以确认'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 确认输入
        run: |
          if [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo "confirm 必须为 deploy"
            exit 1
          fi

      - name: SSH 部署
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" \
            "cd /opt/ecom && bash deploy/deploy.sh '$TAG'"
